server {
    listen 80;
    server_name _;

    # Uploads go up to 1 GB (settings.max_upload_size_mb), and transcription is a long synchronous request.
    client_max_body_size 1100m;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;   # stream big uploads straight to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }
}
